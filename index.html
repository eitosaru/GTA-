    /* 下側（ボタンの部分）を薄く暗くして、人物や車に重なっても読みやすくする（スマホ用） */
    .bg::after {
      content: ''; position: absolute; inset: 0;
      /* 全体を暗い色で覆って壁紙を薄くする（0.45の数字を大きくするともっと薄く、小さくすると元に近づく） */
      background:
        linear-gradient(to top, rgba(7, 2, 18, 0.5) 0%, rgba(7, 2, 18, 0.28) 22%, rgba(7, 2, 18, 0) 42%),
        rgba(7, 2, 18, 0.45);
    }

    /* ===== ヘッダー ===== */
    .wrap { width: 100%; max-width: 448px; margin: 0 auto; }
    header { flex-shrink: 0; position: relative; z-index: 2; padding: 12px 16px 8px; }
    .head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .logo { display: flex; align-items: baseline; gap: 10px; }
    .logo-mark {
      font-family: 'Archivo Black', Impact, 'Arial Black', sans-serif;
      font-size: 32px;
      line-height: 1;
      letter-spacing: 0.02em;
      background: linear-gradient(180deg, var(--pink) 0%, var(--orange) 55%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.4));
    }
    .logo-sub { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; color: #f3d3ea; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
    #clock { font-size: 12px; font-weight: 700; color: #f3d3ea; text-shadow: 0 1px 4px rgba(0,0,0,.5); }

    nav {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px;
      border-radius: 18px; background: var(--card-solid); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .tab-btn {
      padding: 7px 0; border-radius: 14px; font-size: 12px; font-weight: 700;
      color: var(--muted); border: 1px solid transparent; transition: all .2s;
    }
    .tab-btn.active {
      color: #ffd0e8; background: rgba(255, 79, 163, 0.22); border-color: rgba(255, 79, 163, 0.55);
    }

    /* ===== スライド領域 ===== */
    main { flex: 1; width: 100%; overflow: hidden; position: relative; z-index: 1; }
    #track {
      display: flex; width: 300vw; height: 100%;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    #track.dragging { transition: none; }
    .page { width: 100vw; height: 100%; flex-shrink: 0; overflow: hidden; padding: 0 16px 16px; }
    /* スマホ：タイマー系の画面は中央寄りまで上げる */
    .page.lift { padding-bottom: calc(16px + clamp(40px, 14vh, 140px)); }
    .page-inner { width: 100%; max-width: 448px; margin: 0 auto; height: 100%; }

    .card {
      border-radius: 20px; background: var(--card); border: 1px solid var(--line);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    }

    /* ===== タイマー ===== */
    .timer-card {
      height: 100%; border-radius: 28px; padding: 20px 20px 12px;
      background: none; border: 0;
      -webkit-backdrop-filter: none; backdrop-filter: none;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    }
    .timer-bottom {
      margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .status {
      display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: rgba(255, 255, 255, 0.1); color: var(--muted); margin-top: 4px;
    }
    .status.is-run { background: rgba(255, 79, 163, 0.25); color: #ffd0e8; }
    .status.is-break { background: rgba(94, 242, 214, 0.2); color: var(--teal); }
    /* 明るい壁紙の上でも読めるよう、ステータス表示は濃い背景にする */
    .status { background: rgba(7, 2, 18, 0.65); border: 1px solid var(--line); }
    .status.is-run { background: rgba(70, 12, 50, 0.85); }
    .status.is-break { background: rgba(6, 40, 44, 0.85); }
    #countdown {
      font-size: clamp(60px, 20vw, 84px); font-weight: 900; letter-spacing: -0.02em; line-height: 1;
      color: #fff; text-shadow: 0 0 28px rgba(255, 79, 163, 0.6), 0 3px 0 rgba(0, 0, 0, 0.45), 0 0 6px rgba(0,0,0,.4);
    }
    .controls { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 8px; }
    .btn-primary {
      width: 100%; padding: 16px 0; border-radius: 18px; font-size: 16px; font-weight: 900; color: #2a0626;
      background: linear-gradient(90deg, var(--pink), var(--orange));
      box-shadow: 0 6px 24px rgba(255, 79, 163, 0.35); transition: transform .1s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary.is-running {
      color: var(--text); background: rgba(255, 255, 255, 0.12); border: 1px solid var(--line); box-shadow: none;
    }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-sub {
      padding: 9px 0; border-radius: 14px; font-size: 12px; font-weight: 700;
      background: rgba(7, 2, 18, 0.6); border: 1px solid var(--line); color: var(--muted);
    }
    .btn-sub.teal { color: var(--teal); }

    /* ===== PLAY TIME（ゲーム時間） ===== */
    .play-elapsed {
      font-size: clamp(48px, 15vw, 72px); font-weight: 900; letter-spacing: -0.02em; line-height: 1;
      color: #fff; text-shadow: 0 0 28px rgba(255, 79, 163, 0.6), 0 3px 0 rgba(0, 0, 0, 0.45), 0 0 6px rgba(0,0,0,.4);
    }
    .play-stats { width: 100%; max-width: 320px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat {
      padding: 8px 10px; border-radius: 14px; text-align: center;
      background: rgba(7, 2, 18, 0.6); border: 1px solid var(--line);
    }
    .stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; color: var(--muted); }
    .stat-val { font-size: 15px; font-weight: 900; color: var(--orange); margin-top: 2px; }
    .play-log {
      width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 3px;

<body>

  <div class="bg"></div>

  <header>
    <div class="wrap">

  <main id="viewport">

      <!-- 1. 記録 -->
      <section class="page">

              <div class="stat"><div class="stat-label">THIS MONTH</div><div id="hMonth" class="stat-val num">0m</div></div>

            </div>

          </div>

          <div class="card hist-card">
            <div class="cal-head">

              </div>

        </div>

      <!-- 3. 設定 -->
      <section class="page">
        <div class="page-inner settings">
          <div class="card set-card">

            </div>

              <button data-min="30" class="preset">30分</button>
              <button data-min="45" class="preset">45分</button>
              <button data-min="60" class="preset active">60分</button>
              <button data-min="90" class="preset">90分</button>

            <div class="slider-row">
              <span class="num">5m</span>

  <!-- 30秒 休憩オーバーレイ -->

    </div>
    <div></div>
  </div>

  <script>
    (() => {
      const DEFAULT_BREAK = 30;
      const STORAGE_KEY = 'gta6_clean_timer_v1';
      const LAST_PAGE = 2;
      const WAKE_HINT = 'タイマー稼働中は画面を点けたままにします';

      const state = {
        page: 1,
        focusMin: 60,
        remainSec: 60 * 60,
        breakSec: DEFAULT_BREAK,
        breakLen: DEFAULT_BREAK,
        volume: 60,
        running: false,
        inBreak: false,
        wakeEnabled: true,
        wakeLock: null,
        intervalId: null,
        lastTickAt: Date.now()
      };

      const el = {
        clock: document.getElementById('clock'),
        track: document.getElementById('track'),
        viewport: document.getElementById('viewport'),
        tabs: document.querySelectorAll('.tab-btn'),
        statusLabel: document.getElementById('statusLabel'),
        countdown: document.getElementById('countdown'),
        startPauseBtn: document.getElementById('startPauseBtn'),
        resetTimerBtn: document.getElementById('resetTimerBtn'),
        testBreakBtn: document.getElementById('testBreakBtn'),
        intervalLabel: document.getElementById('intervalLabel'),
        presets: document.querySelectorAll('.preset'),
        intervalSlider: document.getElementById('intervalSlider'),
        wakeToggleBtn: document.getElementById('wakeToggleBtn'),
        wakeHint: document.getElementById('wakeHint'),
        breakScreen: document.getElementById('breakScreen'),
        breakSec: document.getElementById('breakSec'),
        breakLabel: document.getElementById('breakLabel'),
        intervalInput: document.getElementById('intervalInput'),
        breakInput: document.getElementById('breakInput'),
        volumeSlider: document.getElementById('volumeSlider'),
        volumeLabel: document.getElementById('volumeLabel')
      };

      function nowHM() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }

      function fmtMMSS(sec) {
        const s = Math.max(0, sec);
        return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      }

      // 設定のみ保存
      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            focusMin: state.focusMin,
            breakLen: state.breakLen,
            volume: state.volume,
            wakeEnabled: state.wakeEnabled
          }));
        } catch (_) {}
      }

      function load() {
        try {
          const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (raw) {
            if (raw.focusMin >= 1 && raw.focusMin <= 600) state.focusMin = Math.round(raw.focusMin);
            if (raw.breakLen >= 5 && raw.breakLen <= 300) state.breakLen = Math.round(raw.breakLen);
            if (raw.volume >= 0 && raw.volume <= 100) state.volume = Math.round(raw.volume);
            if (typeof raw.wakeEnabled === 'boolean') state.wakeEnabled = raw.wakeEnabled;
          }
        } catch (_) {}
        state.remainSec = state.focusMin * 60;
      }

      // チャイム（iOS等のためスタート時に先に解除しておく）
      let audioCtx, masterGain;
      function applyVolume() {
        if (masterGain) masterGain.gain.value = state.volume / 100 * 1.6;
      }
      function unlockAudio() {
        try {
          if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            audioCtx = new Ctx();
            masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            applyVolume();
          }
          if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (_) {}
      }

      function playChime(type = 'break') {
        try {
          unlockAudio();
          if (!audioCtx) return;
          const custom = voices[type === 'break' ? 'stop' : 'resume'].buffer;
          if (custom) { playBuffer(custom); return; }
          const t = audioCtx.currentTime;
          const notes = type === 'break' ? [523.25, 783.99] : [659.25];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t + idx * 0.22);
            gain.gain.setValueAtTime(0.0001, t + idx * 0.22);
            gain.gain.exponentialRampToValueAtTime(0.14, t + idx * 0.22 + 0.06);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + idx * 0.22 + 1.2);
            osc.connect(gain);
            gain.connect(masterGain || audioCtx.destination);
            osc.start(t + idx * 0.22);
            osc.stop(t + idx * 0.22 + 1.25);
          });
        } catch (_) {}
      }

      // ===== 自分の声（録音 or ファイル）：止める合図 / 再開の合図 =====
      const VOICE_KEYS = { stop: 'gta6_voice_v1', resume: 'gta6_voice_resume_v1' };
      const SLOT_CHIME = { stop: 'break', resume: 'resume' };
      const MAX_REC_SEC = 8;
      const MAX_BYTES = 1500000;
      const voices = { stop: { buffer: null }, resume: { buffer: null } };
      const rows = {};
      document.querySelectorAll('.voice-row').forEach(r => {
        rows[r.dataset.slot] = {
          status: r.querySelector('.voice-status'),
          play: r.querySelector('.v-play'),
          rec: r.querySelector('.v-rec'),
          file: r.querySelector('.v-file'),
          del: r.querySelector('.v-del')
        };
      });
      const fileInput = document.getElementById('fileInput');
      let rec = null, recSlot = null, recTimer = null, fileSlot = null;

      function playBuffer(buf) {
        try {
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          src.connect(masterGain || audioCtx.destination);
          src.start();
        } catch (_) {}
      }

      function renderVoice(slot) {
        const r = rows[slot];
        const has = !!voices[slot].buffer;
        const recording = !!rec && recSlot === slot;
        r.status.textContent = recording ? '録音中…' : (has ? '自分の声' : 'チャイム');
        r.del.disabled = !has;
        r.rec.textContent = recording ? '停止' : '録音';
        r.rec.classList.toggle('rec', recording);
      }

      function flashStatus(slot, text) {
        rows[slot].status.textContent = text;
        setTimeout(() => renderVoice(slot), 7000);
      }

      async function decodeVoice(dataUrl) {
        unlockAudio();
        if (!audioCtx) throw new Error('no audio');
        const bin = atob(dataUrl.split(',')[1]);
        const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        const ab = u8.buffer;
        return await new Promise((ok, ng) => audioCtx.decodeAudioData(ab, ok, ng));
      }

      async function saveVoiceBlob(slot, blob) {
        if (blob.size > MAX_BYTES) { flashStatus(slot, 'ファイルが大きすぎます（' + (blob.size / 1000000).toFixed(1) + 'MB・上限1.5MB）'); return; }
        const dataUrl = await new Promise((ok, ng) => {
          const r = new FileReader();
          r.onload = () => ok(r.result);
          r.onerror = ng;
          r.readAsDataURL(blob);
        });
        try {
          voices[slot].buffer = await decodeVoice(dataUrl);
        } catch (_) {
          voices[slot].buffer = null;
          flashStatus(slot, 'この形式は使えません');
          return;
        }
        try { localStorage.setItem(VOICE_KEYS[slot], dataUrl); } catch (_) {
          flashStatus(slot, '保存できず（今回のみ）');
        }
        renderVoice(slot);
        playBuffer(voices[slot].buffer);
      }

      async function loadVoices() {
        for (const slot of Object.keys(voices)) {
          try {
            const d = localStorage.getItem(VOICE_KEYS[slot]);
            if (d) voices[slot].buffer = await decodeVoice(d);
          } catch (_) { voices[slot].buffer = null; }
          renderVoice(slot);
        }
      }

      async function toggleRecord(slot) {
        if (rec) { rec.stop(); return; }
        if (!navigator.mediaDevices || !window.MediaRecorder) {
          flashStatus(slot, '録音は非対応（ファイルで）');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']
            .find(t => MediaRecorder.isTypeSupported(t)) || '';
          const chunks = [];
          const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
          rec = recorder;
          recSlot = slot;
          recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
          recorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            clearTimeout(recTimer);
            const type = recorder.mimeType || mime || 'audio/mp4';
            rec = null;
            recSlot = null;
            renderVoice(slot);
            if (chunks.length) await saveVoiceBlob(slot, new Blob(chunks, { type }));
          };
          recorder.start();
          recTimer = setTimeout(() => rec === recorder && recorder.stop(), MAX_REC_SEC * 1000);
          renderVoice(slot);
        } catch (_) {
          rec = null;
          recSlot = null;
          renderVoice(slot);
          flashStatus(slot, 'マイクが使えません');
        }
      }

      Object.keys(rows).forEach(slot => {
        const r = rows[slot];
        r.play.addEventListener('click', () => playChime(SLOT_CHIME[slot]));
        r.rec.addEventListener('click', () => toggleRecord(slot));
        r.file.addEventListener('click', () => { fileSlot = slot; fileInput.click(); });
        r.del.addEventListener('click', () => {
          voices[slot].buffer = null;
          try { localStorage.removeItem(VOICE_KEYS[slot]); } catch (_) {}
          renderVoice(slot);
        });
      });
      fileInput.addEventListener('change', async e => {
        const f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (f && fileSlot) await saveVoiceBlob(fileSlot, f);
      });

      // 画面スリープ防止
      async function syncWakeLock() {
        if (!state.wakeEnabled || !state.running) {
          if (state.wakeLock) {
            try { await state.wakeLock.release(); } catch (_) {}
            state.wakeLock = null;
          }
          return;
        }
        if (!('wakeLock' in navigator)) {
          el.wakeHint.textContent = 'この端末では非対応です';
          return;
        }
        try {
          if (!state.wakeLock) {
            state.wakeLock = await navigator.wakeLock.request('screen');
            el.wakeHint.textContent = WAKE_HINT;
            state.wakeLock.addEventListener('release', () => { state.wakeLock = null; });
          }
        } catch (_) {
          el.wakeHint.textContent = '省電力モード中は制限される場合があります';
        }
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') syncWakeLock();
      });

      function renderAll() {
        el.countdown.textContent = fmtMMSS(state.remainSec);
        el.breakSec.textContent = String(state.breakSec);

        if (state.inBreak) {
          el.statusLabel.textContent = '休憩中';
          el.statusLabel.className = 'status is-break';
        } else if (state.running) {
          el.statusLabel.textContent = '稼働中';
          el.statusLabel.className = 'status is-run';
          el.startPauseBtn.textContent = 'STOP';
          el.startPauseBtn.classList.add('is-running');
        } else {
          el.statusLabel.textContent = '停止中';
          el.statusLabel.className = 'status';
          el.startPauseBtn.textContent = 'START';
          el.startPauseBtn.classList.remove('is-running');
        }

        el.intervalLabel.textContent = `${state.focusMin}分`;
        el.intervalSlider.value = String(Math.min(180, state.focusMin));
        if (document.activeElement !== el.intervalInput) el.intervalInput.value = String(state.focusMin);
        if (document.activeElement !== el.breakInput) el.breakInput.value = String(state.breakLen);
        el.volumeSlider.value = String(state.volume);
        el.volumeLabel.textContent = `${state.volume}%`;
        el.presets.forEach(btn => {
          btn.classList.toggle('active', Number(btn.dataset.min) === state.focusMin);
        });

        el.wakeToggleBtn.textContent = state.wakeEnabled ? 'ON' : 'OFF';
        el.wakeToggleBtn.classList.toggle('on', state.wakeEnabled);
        el.wakeToggleBtn.classList.toggle('off', !state.wakeEnabled);
      }

      function startBreak() {
        state.inBreak = true;
        state.breakSec = state.breakLen;
        state.lastTickAt = Date.now();
        el.breakLabel.textContent = `${state.breakLen}秒ケアタイム（自動で次へ進みます）`;
        el.breakScreen.classList.remove('hidden');
        playChime('break');
        renderAll();
      }

      function finishBreak(completed) {
        state.inBreak = false;
        el.breakScreen.classList.add('hidden');
        state.remainSec = state.focusMin * 60;
        state.lastTickAt = Date.now();
        if (completed) playChime('resume');
        renderAll();
      }

      // 実際の経過時間で計算（バックグラウンドで間引かれてもズレない）
      function tick() {
        if (!state.running) return;
        const now = Date.now();
        const delta = Math.floor((now - state.lastTickAt) / 1000);
        if (delta < 1) return;
        state.lastTickAt += delta * 1000;

        if (state.inBreak) {
          state.breakSec -= delta;
          el.breakSec.textContent = String(Math.max(0, state.breakSec));
          if (state.breakSec <= 0) finishBreak(true);
        } else {
          state.remainSec -= delta;
          if (state.remainSec <= 0) startBreak();
          else el.countdown.textContent = fmtMMSS(state.remainSec);
        }
      }

      function startRunning() {
        state.running = true;
        unlockAudio();
        state.lastTickAt = Date.now();
        if (!state.intervalId) state.intervalId = setInterval(tick, 1000);
        syncWakeLock();
      }

      // START / STOP：休憩タイマーとプレイ時間を一緒に動かす・止める
      function toggleRun() {
        if (state.running) {
          state.running = false;
          syncWakeLock();
          playStop();
        } else {
          startRunning();
          playStart();
        }
        renderAll();
        if (state.page === 0) renderHistory();
      }

      function resetTimer() {
        state.running = false;
        state.inBreak = false;
        el.breakScreen.classList.add('hidden');
        state.remainSec = state.focusMin * 60;
        syncWakeLock();
        playStop();
        renderAll();
      }

      // ナビゲーション＆横スワイプ
      function setPage(idx) {
        state.page = Math.max(0, Math.min(LAST_PAGE, idx));
        el.track.classList.remove('dragging');
        el.track.style.transform = `translateX(-${state.page * 100}vw)`;
        el.tabs.forEach((btn, i) => btn.classList.toggle('active', i === state.page));
        if (state.page === 0) renderHistory();
      }

      el.tabs.forEach(btn => btn.addEventListener('click', () => setPage(Number(btn.dataset.page))));

      let startX = 0, startY = 0, dragging = false, horiz = null;

      function onDown(x, y, target) {
        if (target && target.closest('input, button')) return;
        startX = x; startY = y; dragging = true; horiz = null;
        el.track.classList.add('dragging');
      }

      function onMove(x, y) {
        if (!dragging) return;
        const dx = x - startX;
        const dy = y - startY;
        if (horiz === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) horiz = Math.abs(dx) > Math.abs(dy);
        if (!horiz) return;
        let moveX = dx;
        if ((state.page === 0 && dx > 0) || (state.page === LAST_PAGE && dx < 0)) moveX = dx * 0.25;
        el.track.style.transform = `translateX(${-state.page * window.innerWidth + moveX}px)`;
      }

      function onUp(x) {
        if (!dragging) return;
        dragging = false;
        el.track.classList.remove('dragging');
        if (horiz) {
          const dx = x - startX;
          const th = window.innerWidth * 0.18;
          if (dx < -th && state.page < LAST_PAGE) return setPage(state.page + 1);
          if (dx > th && state.page > 0) return setPage(state.page - 1);
        }
        setPage(state.page);
      }

      el.viewport.addEventListener('touchstart', e => e.touches.length === 1 && onDown(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive: true });
      el.viewport.addEventListener('touchmove', e => e.touches.length === 1 && onMove(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      el.viewport.addEventListener('touchend', e => e.changedTouches.length === 1 && onUp(e.changedTouches[0].clientX));
      el.viewport.addEventListener('mousedown', e => onDown(e.clientX, e.clientY, e.target));
      window.addEventListener('mousemove', e => dragging && onMove(e.clientX, e.clientY));
      window.addEventListener('mouseup', e => dragging && onUp(e.clientX));

      // ボタン操作
      el.startPauseBtn.addEventListener('click', toggleRun);
      el.resetTimerBtn.addEventListener('click', resetTimer);
      el.testBreakBtn.addEventListener('click', () => {
        if (!state.running) { startRunning(); playStart(); }
        unlockAudio();
        startBreak();
      });

      function setIntervalMin(m) {
        m = Math.min(600, Math.max(1, Math.round(Number(m)) || 60));
        state.focusMin = m;
        if (!state.inBreak) state.remainSec = m * 60;
        save();
        renderAll();
      }

      el.presets.forEach(btn => btn.addEventListener('click', () => setIntervalMin(Number(btn.dataset.min))));
      el.intervalSlider.addEventListener('input', e => {
        el.intervalLabel.textContent = `${e.target.value}分`;
        el.intervalInput.value = e.target.value;
      });
      el.intervalSlider.addEventListener('change', e => setIntervalMin(Number(e.target.value)));

      // 数字を直接入力（1〜600分 / 休憩5〜300秒）
      function commitNumber(input, apply) {
        const v = parseInt(input.value, 10);
        if (Number.isFinite(v)) apply(v); else renderAll();
      }
      el.intervalInput.addEventListener('change', () => commitNumber(el.intervalInput, setIntervalMin));
      el.breakInput.addEventListener('change', () => commitNumber(el.breakInput, v => {
        state.breakLen = Math.min(300, Math.max(5, v));
        save();
        renderAll();
      }));
      [el.intervalInput, el.breakInput].forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); }));

      // 音量
      el.volumeSlider.addEventListener('input', e => {
        state.volume = Number(e.target.value);
        el.volumeLabel.textContent = `${state.volume}%`;
        applyVolume();
      });
      el.volumeSlider.addEventListener('change', () => { save(); playChime('break'); });

      el.wakeToggleBtn.addEventListener('click', () => {
        state.wakeEnabled = !state.wakeEnabled;
        save();
        syncWakeLock();
        renderAll();
      });

      // ===== PLAY TIME（ゲーム時間：START / STOP。毎日24:00に1日の合計が RECENT へ移る） =====
      const PLAY_KEY = 'gta6_playtime_v2';
      const PLAY_KEY_OLD = 'gta6_playtime_v1';
      const play = { startedAt: null, accumMs: 0, dayKey: '', days: [] };
      const pe = {
        elapsed: document.getElementById('playElapsed'),
        week: document.getElementById('playWeek'),
        month: document.getElementById('playMonth'),
        total: document.getElementById('playTotal'),
        log: document.getElementById('playLog')
      };

      function dayKeyOf(t) {
        const d = new Date(t);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      function nextMidnight(key) {
        const [y, m, d] = key.split('-').map(Number);
        return new Date(y, m - 1, d + 1, 0, 0, 0, 0).getTime();
      }
      function playSave() {
        try { localStorage.setItem(PLAY_KEY, JSON.stringify(play)); } catch (_) {}
      }
      function pushDay(key, ms) {
        if (!(ms >= 1000)) return;
        ms = Math.min(ms, 86400000); // 1日は最大24時間
        const e = play.days.find(x => x.day === key);
        if (e) e.ms += ms; else play.days.push({ day: key, ms });
        play.days.sort((a, b) => (a.day < b.day ? -1 : 1));
        if (play.days.length > 1100) play.days = play.days.slice(-1100);
      }
      function playLoad() {
        try {
          const raw = localStorage.getItem(PLAY_KEY);
          if (raw) {
            const r = JSON.parse(raw);
            play.startedAt = typeof r.startedAt === 'number' ? r.startedAt : null;
            play.accumMs = Number(r.accumMs) || 0;
            play.dayKey = typeof r.dayKey === 'string' ? r.dayKey : '';
            play.days = Array.isArray(r.days) ? r.days.filter(x => x && typeof x.day === 'string' && typeof x.ms === 'number') : [];
          } else {
            // 旧バージョン（FINISH方式）の記録を引き継ぐ
            const o = JSON.parse(localStorage.getItem(PLAY_KEY_OLD) || 'null');
            if (o) {
              play.dayKey = dayKeyOf(Date.now());
              play.startedAt = typeof o.startedAt === 'number' ? o.startedAt : null;
              play.accumMs = Number(o.accumMs) || 0;
              (Array.isArray(o.sessions) ? o.sessions : []).forEach(x => {
                if (!x || typeof x.end !== 'number' || typeof x.ms !== 'number') return;
                const k = dayKeyOf(x.end);
                if (k === play.dayKey) play.accumMs += x.ms; else pushDay(k, x.ms);
              });
            }
          }
        } catch (_) {}
        if (!play.dayKey) play.dayKey = dayKeyOf(Date.now());
      }
      // 日付が変わっていたら、前の日の合計を RECENT に移して0から数え直す（動作中なら24:00で区切って続ける）
      function playRollover() {
        let changed = false;
        const today = dayKeyOf(Date.now());
        while (play.dayKey < today) {
          const mid = nextMidnight(play.dayKey);
          if (play.startedAt !== null && play.startedAt < mid) {
            play.accumMs += mid - play.startedAt;
            play.startedAt = mid;
          }
          pushDay(play.dayKey, play.accumMs);
          play.accumMs = 0;
          play.dayKey = dayKeyOf(mid);
          changed = true;
        }
        return changed;
      }
      function playElapsedMs() {
        return play.accumMs + (play.startedAt ? Date.now() - play.startedAt : 0);
      }
      function fmtHMS(ms) {
        const t = Math.floor(ms / 1000);
        const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
        return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
      function fmtHM(ms) {
        const m = Math.round(ms / 60000); // 切り捨てだと 22:00〜24:00 が 1h59m になるので四捨五入
        const h = Math.floor(m / 60);
        return h > 0 ? `${h}h ${m % 60}m` : `${m}m`;
      }
      // 今週（月曜はじまり）・今月・通算の合計
      function periodTotals(cur) {
        const now = new Date();
        const wk = dateKey(mondayOf(now));
        const mo = dateKey(new Date(now.getFullYear(), now.getMonth(), 1));
        let week = 0, month = 0, all = 0;
        play.days.forEach(x => {
          all += x.ms;
          if (x.day >= wk) week += x.ms;
          if (x.day >= mo) month += x.ms;
        });
        all += cur;
        if (play.dayKey >= wk) week += cur;
        if (play.dayKey >= mo) month += cur;
        return { week, month, all };
      }
      function renderPlayTime() {
        const cur = playElapsedMs();
        const t = periodTotals(cur);
        pe.elapsed.textContent = fmtHMS(cur);
        pe.week.textContent = fmtHM(t.week);
        pe.month.textContent = fmtHM(t.month);
        pe.total.textContent = fmtHM(t.all);
      }
      function renderPlayLog() {
        const recent = play.days.slice(-3).reverse();
        pe.log.textContent = '';
        const head = document.createElement('div');
        head.className = 'play-log-head';
        head.textContent = 'RECENT';
        pe.log.appendChild(head);
        recent.forEach(x => {
          const [, mm, dd] = x.day.split('-');
          const row = document.createElement('div');
          row.className = 'play-log-row num';
          const a = document.createElement('span');
          a.textContent = `${Number(mm)}/${Number(dd)}`;
          const b = document.createElement('span');
          b.textContent = fmtHM(x.ms);
          row.append(a, b);
          pe.log.appendChild(row);
        });
        if (!recent.length) {
          const none = document.createElement('div');
          none.textContent = '-';
          pe.log.appendChild(none);
        }
      }
      function playStart() {
        if (playRollover()) renderPlayLog();
        if (!play.startedAt) {
          play.startedAt = Date.now();
          playSave();
          renderPlayTime();
        }
      }
      function playStop() {
        if (playRollover()) renderPlayLog();
        if (play.startedAt) {
          play.accumMs += Date.now() - play.startedAt;
          play.startedAt = null;
          playSave();
          renderPlayTime();
        }
      }
      function playTick() {
        if (playRollover()) { playSave(); renderPlayLog(); renderPlayTime(); if (state.page === 0) renderHistory(); }
        else if (play.startedAt) renderPlayTime();
      }
      playLoad();
      if (playRollover()) playSave();
      renderPlayTime();
      renderPlayLog();
      setInterval(playTick, 500);
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') playTick(); });

      // ===== 記録（カレンダー・週間/月間・グラフ） =====
      const hist = { month: null, range: 'day', selected: null };
      const WD = ['月', '火', '水', '木', '金', '土', '日'];
      const byId = id => document.getElementById(id);
      function dateKey(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      function mondayOf(d) {
        const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
        return x;
      }
      function dayMap() {
        const map = {};
        play.days.forEach(x => { map[x.day] = (map[x.day] || 0) + x.ms; });
        map[play.dayKey] = (map[play.dayKey] || 0) + playElapsedMs();
        return map;
      }
      function sumDates(map, from, days) {
        let s = 0;
        const d = new Date(from);
        for (let i = 0; i < days; i++) { s += map[dateKey(d)] || 0; d.setDate(d.getDate() + 1); }
        return s;
      }
      function fmtH(ms) {
        if (ms < 60000) return '';
        const h = ms / 3600000;
        return h >= 10 ? `${Math.round(h)}h` : `${Math.round(h * 10) / 10}h`;
      }
      function levelOf(ms) {
        const h = ms / 3600000;
        if (ms < 60000) return 0;
        if (h < 1) return 1;
        if (h < 3) return 2;
        if (h < 5) return 3;
        if (h < 8) return 4;
        return 5;
      }
      function mk(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      function renderHistory() {
        const map = dayMap();
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        if (!hist.month) hist.month = new Date(today.getFullYear(), today.getMonth(), 1);

        // サマリー（今週・今月・今月の最長日）
        const mStart = new Date(today.getFullYear(), today.getMonth(), 1);
        const mDays = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
        let best = 0, bestDay = 0;
        for (let i = 0; i < mDays; i++) {
          const v = map[dateKey(new Date(mStart.getFullYear(), mStart.getMonth(), i + 1))] || 0;
          if (v > best) { best = v; bestDay = i + 1; }
        }
        byId('hWeek').textContent = fmtHM(sumDates(map, mondayOf(today), 7));
        byId('hMonth').textContent = fmtHM(sumDates(map, mStart, mDays));
        byId('hBestLabel').textContent = best >= 60000 ? `BEST ${today.getMonth() + 1}/${bestDay}` : 'BEST DAY';
        byId('hBest').textContent = best >= 60000 ? fmtHM(best) : '-';

        // グラフ
        const cols = [];
        let note = '';
        if (hist.range === 'day') {
          for (let i = 6; i >= 0; i--) {
            const d = new Date(today); d.setDate(d.getDate() - i);
            cols.push({ v: map[dateKey(d)] || 0, label: `${d.getDate()}(${WD[(d.getDay() + 6) % 7]})`, today: i === 0 });
          }
          note = '直近7日';
        } else if (hist.range === 'week') {
          const mon = mondayOf(today);
          for (let i = 7; i >= 0; i--) {
            const st = new Date(mon); st.setDate(st.getDate() - 7 * i);
            cols.push({ v: sumDates(map, st, 7), label: `${st.getMonth() + 1}/${st.getDate()}`, today: i === 0 });
          }
          note = '直近8週（月曜はじまり）';
        } else {
          for (let i = 5; i >= 0; i--) {
            const st = new Date(today.getFullYear(), today.getMonth() - i, 1);
            const n = new Date(st.getFullYear(), st.getMonth() + 1, 0).getDate();
            cols.push({ v: sumDates(map, st, n), label: `${st.getMonth() + 1}月`, today: i === 0 });
          }
          note = '直近6か月';
        }
        const sum = cols.reduce((a, c) => a + c.v, 0);
        const noteEl = byId('chartNote');
        noteEl.textContent = '';
        noteEl.append(`${note} 合計 `, mk('b', '', fmtHM(sum)));
        const max = Math.max(3600000, ...cols.map(c => c.v));
        const chart = byId('chart');
        chart.textContent = '';
        cols.forEach(c => {
          const col = mk('div', 'bar-col' + (c.today ? ' today' : ''));
          col.appendChild(mk('div', 'bar-val', fmtH(c.v)));
          const track = mk('div', 'bar-track');
          const bar = mk('div', 'bar');
          bar.style.height = (c.v > 0 ? Math.max(4, Math.round(c.v / max * 84)) : 0) + 'px';
          track.appendChild(bar);
          col.appendChild(track);
          col.appendChild(mk('div', 'bar-lab', c.label));
          chart.appendChild(col);
        });

        // カレンダー
        const y = hist.month.getFullYear(), m = hist.month.getMonth();
        const dim = new Date(y, m + 1, 0).getDate();
        const offset = (new Date(y, m, 1).getDay() + 6) % 7;
        const isCurMonth = y === today.getFullYear() && m === today.getMonth();
        byId('calTitle').textContent = `${y}年${m + 1}月　${fmtHM(sumDates(map, new Date(y, m, 1), dim))}`;
        byId('calNext').disabled = isCurMonth;
        const grid = byId('calGrid');
        grid.textContent = '';
        WD.forEach(w => grid.appendChild(mk('div', 'cal-wd', w)));
        for (let i = 0; i < offset; i++) grid.appendChild(mk('div', 'cal-cell empty'));
        for (let d = 1; d <= dim; d++) {
          const key = dateKey(new Date(y, m, d));
          const v = map[key] || 0;
          const lv = levelOf(v);
          const cell = mk('button', 'cal-cell' + (lv ? ` lv${lv}` : '') + (isCurMonth && d === today.getDate() ? ' today' : '') + (hist.selected === key ? ' sel' : ''));
          cell.dataset.day = key;
          cell.appendChild(mk('span', 'd', String(d)));
          cell.appendChild(mk('span', 'h', fmtH(v)));
          grid.appendChild(cell);
        }
        const detail = byId('calDetail');
        if (hist.selected) {
          const [yy, mm, dd] = hist.selected.split('-').map(Number);
          const wd = WD[(new Date(yy, mm - 1, dd).getDay() + 6) % 7];
          const v = map[hist.selected] || 0;
          detail.textContent = `${mm}/${dd}（${wd}）　${v >= 60000 ? fmtHM(v) : 'プレイなし'}`;
        } else {
          detail.textContent = '日付をタップすると時間が出ます';
        }
      }

      byId('rangeSeg').addEventListener('click', e => {
        const b = e.target.closest('[data-range]');
        if (!b) return;
        hist.range = b.dataset.range;
        document.querySelectorAll('#rangeSeg .seg-btn').forEach(x => x.classList.toggle('active', x === b));
        renderHistory();
      });
      byId('calPrev').addEventListener('click', () => { hist.month = new Date(hist.month.getFullYear(), hist.month.getMonth() - 1, 1); renderHistory(); });
      byId('calNext').addEventListener('click', () => { hist.month = new Date(hist.month.getFullYear(), hist.month.getMonth() + 1, 1); renderHistory(); });
      byId('calGrid').addEventListener('click', e => {
        const b = e.target.closest('[data-day]');
        if (!b) return;
        hist.selected = b.dataset.day;
        renderHistory();
      });
      setInterval(() => { if (state.page === 0) renderHistory(); }, 15000);

      load();
      loadVoices();
      renderAll();
      setPage(1);
      el.clock.textContent = nowHM();
      setInterval(() => { el.clock.textContent = nowHM(); }, 10000);
    })();
  </script>
</body>
</html>
